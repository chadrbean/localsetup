# LiteLLM quickstart stack: the gateway plus a Postgres database that stores
# models, virtual keys, and spend logs, plus a Redis sidecar (litellm_redis) that
# serves LiteLLM's response cache (cache_params.type: redis; host port
# 127.0.0.1:6380 loopback-only, internal name redis:6379). Used by https://docs.litellm.ai/docs/proxy/docker_quick_start
#
# Start it directly:
#   curl -sSL https://docs.litellm.ai/docker-compose.yml | docker compose -f - up -d
#
# LITELLM_MASTER_KEY and LITELLM_SALT_KEY are real (non-placeholder) values in
# ../.env — do NOT set them here, since a hardcoded `environment:` value here
# would silently override whatever real value the mounted .env provides.
# Image is pinned to `main-stable` (last commit that passed LiteLLM's full
# test suite) rather than `latest` (untested bleeding edge).
# Ports bind to loopback only — this box holds provider API keys behind it;
# widen to 0.0.0.0 only if you deliberately want LAN access from other devices.
# Logs: podman's default journald keeps stdout per container id (grep-able via
# journalctl CONTAINER_NAME=litellm_litellm_1 even after recreate), and the
# command below ALSO appends stdout to the named `litellm_logs` volume
# (/var/log/litellm/proxy.log) for a stable on-disk path. The tee'd file is
# not auto-rotated — truncate it if it grows large.
services:
  litellm:
    image: docker.litellm.ai/berriai/litellm-database:main-stable
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      DATABASE_URL: postgresql://litellm:litellm@db:5432/litellm
      STORE_MODEL_IN_DB: "True"
      # Redis response cache (sibling `redis` service, internal name `redis:6379`);
      # LiteLLM reads these via cache_params in litellm-config.yaml
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./litellm-config.yaml:/app/config.yaml
      - ../.env:/app/.env # Load local .env file (LITELLM_MASTER_KEY, LITELLM_SALT_KEY, provider keys)
      - litellm_logs:/var/log/litellm # persistent proxy.log (see logging.driver above)
    healthcheck:  # Defines the health check configuration for the container
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"  # Command to execute for health check
    # Override entrypoint (image's prod_entrypoint.sh is just `exec litellm "$@"`,
    # ddtrace branch unused) so stdout is tee'd into the persistent log volume.
    entrypoint: ["/bin/sh", "-c"]
    command: ["exec litellm --config /app/config.yaml --port 4000 2>&1 | tee -a /var/log/litellm/proxy.log"]

  db:
    image: postgres:16
    restart: unless-stopped
    container_name: litellm_db
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persist data across multiple restarts
    ports:
      - "127.0.0.1:5433:5432" # loopback-only; host 5432 is taken by claude-accounting_postgres_1 (unrelated project); container side stays 5432, DATABASE_URL uses db:5432 internally

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    container_name: litellm_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6380:6379" # loopback-only host port; container stays 6379 (internal name `redis:6379`); 6380 avoids the common 6379

networks:
  default:
    name: litellm_default
volumes:
  postgres_data:
    name: litellm_postgres_data # Named volume for Postgres data persistence
  redis_data:
    name: litellm_redis_data # Named volume for Redis persistence (AOF)
  litellm_logs:
    name: litellm_logs # Persistent gateway log volume (proxy.log + rotate) — survives container replacement
