# LiteLLM gateway config — localsetup
# Spine: flash/pro/kimi (native + OpenRouter escalation) + OpenRouter lite/planning
# tiers + native Auto Router v2 (complexity-based) + guardrails.
# Model IDs & prices verified against PLAN.md research (2026-08-31) — re-check
# pricepertoken.com / openrouter.ai monthly, Chinese-vendor slugs churn fast.

model_list:
  # --- DeepSeek native spine (cache + off-peak discounts only apply natively) ---
  - model_name: flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info:
      input_cost_per_token: 0.00000005          # $0.14/M (off-peak halves this)
      output_cost_per_token: 0.00000013         # $0.28/M
      cache_read_input_token_cost: 0.0000000028 # $0.0028/M
      max_input_tokens: 1000000                 # DeepSeek V4 1M ctx


  # --- Z.AI direct (native `zai` provider, reads ZAI_API_KEY from the mounted .env) ---
  # Direct rather than via OpenRouter, per the provider principle in README.md: it
  # buys cache-read pricing OpenRouter does not expose, and sidesteps the
  # account-level guardrail/data-policy layer that broke routing twice on
  # 2026-09-07. Prices below are LiteLLM's own cost map, not a marketing page.
  - model_name: zai-free
    litellm_params:
      model: zai/glm-4.7-flash
      api_key: os.environ/ZAI_API_KEY
    model_info:
      input_cost_per_token: 0.0                 # genuinely $0 — and unlike OpenRouter's
      output_cost_per_token: 0.0                # free tier, no train-on-input / publish-
      cache_read_input_token_cost: 0.0          # prompts consent required
      max_input_tokens: 200000
      # MEASURED 2026-09-07: the free tier is heavily rate limited — 2/10 calls
      # succeeded at ~10 req/min ("ZaiException - Rate limit reached for
      # requests"). Fine for an occasional manual `/model free`


  # --- OpenRouter — LITE tier: cheap/fast, everyday small tasks ---
  - model_name: or-lite-glm
    litellm_params:
      model: openrouter/z-ai/glm-5.3-flash
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      input_cost_per_token: 0.000000075         # $0.075/M (verified 2026-09-08)
      output_cost_per_token: 0.00000025         # $0.25/M
      max_input_tokens: 1310720                 # GLM-5.3-Flash 1.31M ctx
  - model_name: or-lite-qwen
    litellm_params:
      model: openrouter/qwen/qwen3.7-flash
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      input_cost_per_token: 0.00000003          # $0.03/M (price dropped; verified 2026-09-08)
      output_cost_per_token: 0.00000013         # $0.13/M
      max_input_tokens: 1000000                 # 1M ctx even in the lite tier


  # --- Auto Router v2 (native complexity routing) ---
  # releases (ships v1.94.x+).
  - model_name: smart
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_config:
        classifier_type: llm
        classifier_llm_config:
          model: or-lite-deepseek-flash
          classification_rubric: agentic   # unset == LEGACY; see note above
          timeout_ms: 10000
        classifier_fallback: heuristic
        session_affinity: true
        tiers:
          SIMPLE: or-lite-qwen 
          MEDIUM: or-lite-qwen    
          COMPLEX: or-lite-glm 
          REASONING: or-lite-glm 
        return_raw_model_name: true
        keyword_tier_rules:
          - keywords: ["tax", "taxes", "taxation", "1099", "w-2", "s-corp", "scorp", "qbi", "deduction", "depreciation", "amortization", "1040", "1120", "write-off", "revenue recognition"]
            tier: REASONING
          - keywords: ["browser", "scrape", "crawl", "form-fill", "extraction"]
            tier: SIMPLE
          - keywords: ["plan this", "plan the", "design the", "architecture of",
                       "blueprint", "roadmap", "refactor the", "spec for"]
            tier: COMPLEX
      complexity_router_default_model: or-lite-glm
guardrails:
  - guardrail_name: "hide-secrets"
    litellm_params:
      guardrail: "hide-secrets"
      mode: "pre_call"
      default_on: true

litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: 6379
    password: os.environ/REDIS_PASSWORD
    ttl: 86400  # 24h; base default is 60s — that would expire entries between uses
    namespace: "litellm.response_cache"
  callbacks:
    - prometheus
  drop_params: true
  num_retries: 0
  request_timeout: 45

router_settings:

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_spend_logs: false
