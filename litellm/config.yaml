# LiteLLM gateway config — llmlocalsetup
# Spine: flash (DeepSeek V4-Flash) / pro (DeepSeek V4-Pro) / kimi (Kimi K2.6 via OpenRouter)
# Model IDs verified 2026-08-31 against api.deepseek.com and openrouter.ai.

model_list:
  - model_name: flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info:
      input_cost_per_token: 0.00000014          # $0.14/M (off-peak halves this)
      output_cost_per_token: 0.00000028         # $0.28/M
      cache_read_input_token_cost: 0.0000000028 # $0.0028/M
  - model_name: pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info:
      input_cost_per_token: 0.00000042          # ~$0.42/M
      output_cost_per_token: 0.00000084         # ~$0.84/M
  - model_name: kimi
    litellm_params:
      model: openrouter/moonshotai/kimi-k2.6
      api_key: os.environ/OPENROUTER_API_KEY
      # no fallback — premium tier never silently escalates
    model_info:
      input_cost_per_token: 0.00000095          # $0.95/M
      output_cost_per_token: 0.000004           # $4.00/M
      cache_read_input_token_cost: 0.00000016   # $0.16/M

  # --- OpenRouter tier (dedicated key: LITELLM_OPENROUTER_KEY, see create_keys.sh) ---
  - model_name: kimi-code
    litellm_params:
      model: openrouter/moonshotai/kimi-k2.7-code
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      input_cost_per_token: 0.00000066          # $0.66/M
      output_cost_per_token: 0.0000034          # $3.40/M
  - model_name: gpt5
    litellm_params:
      model: openrouter/openai/gpt-5
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      input_cost_per_token: 0.00000125          # $1.25/M
      output_cost_per_token: 0.00001            # $10/M
  - model_name: minimax
    litellm_params:
      model: openrouter/minimax/minimax-m3
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      input_cost_per_token: 0.0000003           # $0.30/M
      output_cost_per_token: 0.0000012          # $1.20/M
  - model_name: glm-flash
    litellm_params:
      model: openrouter/z-ai/glm-5.3-flash
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      input_cost_per_token: 0.00000007          # $0.07/M
      output_cost_per_token: 0.00000025         # $0.25/M

  # --- Auto Router v2 (native complexity routing; replaces RouteLLM for Hermes) ---
  # model "auto": LLM classifier (flash) with agentic rubric; SIMPLE->flash,
  # MEDIUM/COMPLEX->pro, REASONING->kimi-code. Keyword rules are deterministic
  # overrides for the user's domains. Beta feature (LiteLLM docs: /proxy/auto_routing).
  - model_name: auto
    litellm_params:
      model: auto_router/complexity_router_auto
      complexity_router_config:
        classifier_type: llm
        classifier_llm_config:
          model: glm-flash       # deepseek rejects the classifier's response_format; glm-flash is cheap + supports it
          classification_rubric: agentic
        classifier_fallback: heuristic
        tiers:
          SIMPLE: flash
          MEDIUM: pro
          COMPLEX: pro
          REASONING: kimi-code
        default_model: flash
        return_raw_model_name: true
        keyword_tier_rules:
          - keywords: ["tax", "taxes", "taxation", "filing", "1099", "w-2", "s-corp", "scorp", "qbi", "deduction", "depreciation", "amortization", "ledger", "accounting", "bookkeeping", "payroll", "1040", "1120", "write-off", "revenue recognition"]
            tier: REASONING
          - keywords: ["design", "architecture", "debug", "refactor", "distributed", "concurrency", "optimize", "failure mode", "rate limiter"]
            tier: COMPLEX
          - keywords: ["browser", "scrape", "crawl", "form-fill", "extraction"]
            tier: SIMPLE
      complexity_router_default_model: flash

  # watchlist — comment in only when a real task needs them (see docs/MODELS.md)
  # - model_name: qwen-max
  #   litellm_params: {model: openrouter/qwen/qwen3.8-max, api_key: os.environ/OPENROUTER_API_KEY}
  # - model_name: glm
  #   litellm_params: {model: openrouter/z-ai/glm-5.2, api_key: os.environ/OPENROUTER_API_KEY}

litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 120

router_settings:
  fallbacks:
    - flash: ["pro"]            # fail UP one tier only — never kimi

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_spend_logs: false
  database_url: os.environ/LITELLM_DATABASE_URL   # postgres (podman litellm-db) — virtual keys + spend logs
