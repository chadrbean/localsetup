# LiteLLM gateway config — llmlocalsetup
# Spine: flash (DeepSeek V4-Flash) / pro (DeepSeek V4-Pro) / kimi (Kimi K2.6 via OpenRouter)
# Model IDs verified 2026-08-31 against api.deepseek.com and openrouter.ai.

model_list:
  - model_name: flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info:
      input_cost_per_token: 0.00000014          # $0.14/M (off-peak halves this)
      output_cost_per_token: 0.00000028         # $0.28/M
      cache_read_input_token_cost: 0.0000000028 # $0.0028/M
  - model_name: pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info:
      input_cost_per_token: 0.00000042          # ~$0.42/M
      output_cost_per_token: 0.00000084         # ~$0.84/M
  - model_name: kimi
    litellm_params:
      model: openrouter/moonshotai/kimi-k2.6
      api_key: os.environ/OPENROUTER_API_KEY
      # no fallback — premium tier never silently escalates
    model_info:
      input_cost_per_token: 0.00000095          # $0.95/M
      output_cost_per_token: 0.000004           # $4.00/M
      cache_read_input_token_cost: 0.00000016   # $0.16/M

  # --- OpenRouter tier (dedicated key: LITELLM_OPENROUTER_KEY, see create_keys.sh) ---
  - model_name: kimi-code
    litellm_params:
      model: openrouter/moonshotai/kimi-k2.7-code
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      input_cost_per_token: 0.00000066          # $0.66/M
      output_cost_per_token: 0.0000034          # $3.40/M
  - model_name: gpt5
    litellm_params:
      model: openrouter/openai/gpt-5
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      input_cost_per_token: 0.00000125          # $1.25/M
      output_cost_per_token: 0.00001            # $10/M
  - model_name: minimax
    litellm_params:
      model: openrouter/minimax/minimax-m3
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      input_cost_per_token: 0.0000003           # $0.30/M
      output_cost_per_token: 0.0000012          # $1.20/M
  - model_name: glm-flash
    litellm_params:
      model: openrouter/z-ai/glm-5.3-flash
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      input_cost_per_token: 0.00000007          # $0.07/M
      output_cost_per_token: 0.00000025         # $0.25/M

  # watchlist — comment in only when a real task needs them (see docs/MODELS.md)
  # - model_name: qwen-max
  #   litellm_params: {model: openrouter/qwen/qwen3.8-max, api_key: os.environ/OPENROUTER_API_KEY}
  # - model_name: glm
  #   litellm_params: {model: openrouter/z-ai/glm-5.2, api_key: os.environ/OPENROUTER_API_KEY}

litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 120

router_settings:
  fallbacks:
    - flash: ["pro"]            # fail UP one tier only — never kimi

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_spend_logs: false
  database_url: os.environ/LITELLM_DATABASE_URL   # postgres (podman litellm-db) — virtual keys + spend logs
