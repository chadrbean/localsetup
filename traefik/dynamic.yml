# Traefik dynamic config (file provider). One app = one router block.
# PITFALL 0: routers/services MUST nest under a top-level `http:` key.
# Bare top-level `routers:`/`services:` parses as valid YAML but the file
# provider silently loads it as an EMPTY config (no error, no routers) —
# every request falls through to the default self-signed cert / 404.
# PITFALL 1: priorities are explicit because Traefik defaults priority to
# rule LENGTH, and the HostRegexp catch-all is longer than Host(`hermes...`).
# New app routers MUST set a priority above 1.
# PITFALL 2: Traefik v3 changed HostRegexp syntax — plain regex like
# `.+\.chadrbean\.com` silently matches nothing (no error, just 404/418).
# Use the v3 named-variable form: `{name:.+}.chadrbean.com`.
# The wildcard cert is issued once (first router's tls.domains) and shared.
# PITFALL 3: the fail2ban plugin is HTTP-only (Traefik middleware) — it
# cannot see or protect SSH, which is not served on :443. SSH is hardened
# separately: sshd_config key-only auth plus the native fail2ban sshd jail.
# Traefik binds :443 itself (no sslh), so the plugin sees the real client IP.
# PITFALL 4: `watch: true` does not reliably detect an atomic replace/rename
# of this bind-mounted file (e.g. editor "safe save", or a patch tool that
# writes a temp file then renames over the original — the inode changes).
# The container can keep serving the stale content indefinitely with no
# error. In-place edits (sed -i, direct append) preserve the inode and
# reload fine; anything that swaps the inode needs `podman restart traefik`
# to force a rebind. Verify with: `podman exec traefik cat
# /etc/traefik/dynamic.yml` and compare to the host file.

http:
  routers:
    hermes:
      rule: Host(`hermes.chadrbean.com`)
      entryPoints: [websecure]
      service: hermes
      priority: 100
      middlewares: [fail2ban]
      tls:
        certResolver: route53
        domains:
          - main: "*.chadrbean.com"

    catchall:
      rule: HostRegexp(`{sub:.+}.chadrbean.com`)
      entryPoints: [websecure]
      service: noop@internal
      priority: 1
      middlewares: [fail2ban]
      tls:
        certResolver: route53
        domains:
          - main: "*.chadrbean.com"

    dashboard:
      rule: Host(`traefik.chadrbean.com`)
      entryPoints: [websecure]
      service: api@internal
      priority: 100
      middlewares: [dashboard-auth, fail2ban]
      tls:
        certResolver: route53
        domains:
          - main: "*.chadrbean.com"

    otbla:
      rule: Host(`otbla.chadrbean.com`)
      entryPoints: [websecure]
      service: otbla
      priority: 100
      middlewares: [fail2ban]
      tls:
        certResolver: route53
        domains:
          - main: "*.chadrbean.com"

    # Decap CMS local edit: /api/v1 on otbla-local must reach decap-server
    # (:8081), NOT Hugo. Higher priority than the otbla-local router below so
    # the more-specific PathPrefix wins; everything else falls through to Hugo.
    # BOTH otbla-local routers MUST carry otbla-local-auth: decap-server has no
    # auth of its own and its /api/v1 writes the blog working copy, and the Hugo
    # dev server serves /admin/ and drafts. The routers are public (DNS),
    # so a router missing the middleware is an open editor.
    otbla-local-cms:
      rule: Host(`otbla-local.chadrbean.com`) && PathPrefix(`/api/v1`)
      entryPoints: [websecure]
      service: decap-server
      priority: 200
      middlewares: [fail2ban, otbla-local-auth]
      tls:
        certResolver: route53
        domains:
          - main: "*.chadrbean.com"

    otbla-local:
      rule: Host(`otbla-local.chadrbean.com`)
      entryPoints: [websecure]
      service: otbla-local
      priority: 100
      middlewares: [fail2ban, otbla-local-auth]
      tls:
        certResolver: route53
        domains:
          - main: "*.chadrbean.com"

    grafana:
      rule: Host(`grafana.chadrbean.com`)
      entryPoints: [websecure]
      service: grafana
      priority: 100
      middlewares: [fail2ban]
      tls:
        certResolver: route53
        domains:
          - main: "*.chadrbean.com"

    # zca-accounting local stack (web :3001). This router IS the public on/off
    # switch: comment it out (in place, see PITFALL 4) + `podman restart traefik`
    # and the catch-all answers 404. No proxy auth: the app's browser pages send
    # their own `Authorization: Bearer`, which would clobber basicAuth. The app's
    # sign-in is the gate (allowlist + lockout for non-localhost hosts). See
    # zca-accounting/docs/runbooks/external-access.md.
    accounting:
      rule: Host(`accounting.chadrbean.com`)
      entryPoints: [websecure]
      service: accounting
      priority: 100
      middlewares: [fail2ban]
      tls:
        certResolver: route53
        domains:
          - main: "*.chadrbean.com"

    librecrawl:
      rule: Host(`librecrawl.chadrbean.com`)
      entryPoints: [websecure]
      service: librecrawl
      priority: 100
      middlewares: [fail2ban]
      tls:
        certResolver: route53
        domains:
          - main: "*.chadrbean.com"

    serpbear:
      rule: Host(`serpbear.chadrbean.com`)
      entryPoints: [websecure]
      service: serpbear
      priority: 100
      middlewares: [fail2ban]
      tls:
        certResolver: route53
        domains:
          - main: "*.chadrbean.com"

    litellm-root:
      # Redirect bare https://litellm.chadrbean.com/ to the admin UI.
      # Higher priority than the general litellm router below so this
      # exact-path match wins only for "/"; everything else falls through.
      rule: Host(`litellm.chadrbean.com`) && Path(`/`)
      entryPoints: [websecure]
      service: litellm
      priority: 200
      middlewares: [litellm-ui-redirect, fail2ban]
      tls:
        certResolver: route53
        domains:
          - main: "*.chadrbean.com"

    litellm:
      rule: Host(`litellm.chadrbean.com`)
      entryPoints: [websecure]
      service: litellm
      priority: 100
      middlewares: [fail2ban]
      tls:
        certResolver: route53
        domains:
          - main: "*.chadrbean.com"

    me:
      rule: Host(`me.chadrbean.com`)
      entryPoints: [websecure]
      service: me
      priority: 100
      middlewares: [me-dashboard-auth, fail2ban]
      tls:
        certResolver: route53
        domains:
          - main: "*.chadrbean.com"

    # Jenkins CI (../jenkins/). No proxy auth: Jenkins' own login is the only
    # gate (matrix auth, single admin, no anonymous read; 32-char random
    # password in jenkins/.env). /github-webhook/ is HMAC-verified by Jenkins
    # with the GitHub App webhook secret. It uses `fail2ban-jenkins`, not the shared
    # `fail2ban`: a stale Jenkins browser tab polls widget endpoints and gets a 403
    # every few seconds (7,576 in the 2026-09-26 access log), which the shared rule
    # would count as an attack now that real client IPs are visible and would ban the
    # owner (or GitHub's webhook IPs). Only 401s count here.
    jenkins:
      rule: Host(`jenkins.chadrbean.com`)
      entryPoints: [websecure]
      service: jenkins
      priority: 100
      middlewares: [fail2ban-jenkins]
      tls:
        certResolver: route53
        domains:
          - main: "*.chadrbean.com"

  middlewares:
    litellm-ui-redirect:
      redirectRegex:
        regex: "^https://litellm\\.chadrbean\\.com/$"
        replacement: "https://litellm.chadrbean.com/ui"
        permanent: false

    dashboard-auth:
      basicAuth:
        users:
          - "{{ env `TRAEFIK_DASHBOARD_AUTH` }}"

    me-dashboard-auth:
      basicAuth:
        users:
          - "{{ env `ME_DASHBOARD_AUTH` }}"

    # otbla-local.chadrbean.com (Decap CMS + Hugo dev server). fail2ban is listed
    # first on the routers so it wraps this and sees the 401s and bans the client
    # IP after repeated failures. Still use a long password.
    otbla-local-auth:
      basicAuth:
        users:
          - "{{ env `OTBLA_LOCAL_AUTH` }}"

    fail2ban:
      plugin:
        fail2ban:
          rules:
            # Ban an IP for 3h after 5 requests hitting 401/403/404/429 etc
            # within a 10-minute window (dashboard 401s, unknown-subdomain
            # scans through the catch-all, etc).
            bantime: "3h"
            findtime: "10m"
            maxretry: 5
            enabled: true
            statuscode: "400,401,403-499"
          allowlist:
            ip: "127.0.0.1/32,::1/128,192.168.1.0/24"

    # Jenkins only: count 401s (bad API token / basic auth), not 403s, which a
    # stale UI tab produces constantly. Higher limit so a mistyped token doesn't ban.
    fail2ban-jenkins:
      plugin:
        fail2ban:
          rules:
            bantime: "3h"
            findtime: "10m"
            maxretry: 10
            enabled: true
            statuscode: "401"
          allowlist:
            ip: "127.0.0.1/32,::1/128,192.168.1.0/24"

  services:
    hermes:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:9119"

    otbla:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:1313"

    otbla-local:
      loadBalancer:
        servers:
          - url: "http://[::1]:1313"

    decap-server:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8081"

    grafana:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:3000"

    accounting:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:3001"

    librecrawl:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:5000"

    serpbear:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:3002"

    litellm:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:4000"

    me:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:3005"

    jenkins:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:3010"
