# Traefik dynamic config (file provider). One app = one router block.
# PITFALL 0: routers/services MUST nest under a top-level `http:` key.
# Bare top-level `routers:`/`services:` parses as valid YAML but the file
# provider silently loads it as an EMPTY config (no error, no routers) —
# every request falls through to the default self-signed cert / 404.
# PITFALL 1: priorities are explicit because Traefik defaults priority to
# rule LENGTH, and the HostRegexp catch-all is longer than Host(`hermes...`).
# New app routers MUST set a priority above 1.
# PITFALL 2: Traefik v3 changed HostRegexp syntax — plain regex like
# `.+\.chadrbean\.com` silently matches nothing (no error, just 404/418).
# Use the v3 named-variable form: `{name:.+}.chadrbean.com`.
# The wildcard cert is issued once (first router's tls.domains) and shared.
# PITFALL 3: the fail2ban plugin is HTTP-only (Traefik middleware) — it
# cannot see or protect SSH traffic that sslh forwards straight to sshd,
# since that's raw TCP passthrough, never an HTTP request. SSH is hardened
# separately via sshd_config (PasswordAuthentication no).

http:
  routers:
    hermes:
      rule: Host(`hermes.chadrbean.com`)
      entryPoints: [websecure]
      service: hermes
      priority: 100
      middlewares: [fail2ban]
      tls:
        certResolver: route53
        domains:
          - main: "*.chadrbean.com"

    catchall:
      rule: HostRegexp(`{sub:.+}.chadrbean.com`)
      entryPoints: [websecure]
      service: noop@internal
      priority: 1
      middlewares: [fail2ban]
      tls:
        certResolver: route53
        domains:
          - main: "*.chadrbean.com"

    dashboard:
      rule: Host(`traefik.chadrbean.com`)
      entryPoints: [websecure]
      service: api@internal
      priority: 100
      middlewares: [fail2ban, dashboard-auth]
      tls:
        certResolver: route53
        domains:
          - main: "*.chadrbean.com"

  middlewares:
    dashboard-auth:
      basicAuth:
        users:
          - "{{ env `TRAEFIK_DASHBOARD_AUTH` }}"

    fail2ban:
      plugin:
        fail2ban:
          rules:
            # Ban an IP for 3h after 5 requests hitting 401/403/404/429 etc
            # within a 10-minute window (dashboard 401s, unknown-subdomain
            # scans through the catch-all, etc).
            bantime: "3h"
            findtime: "10m"
            maxretry: 5
            enabled: true
            statuscode: "400,401,403-499"
          allowlist:
            ip: "127.0.0.1/32,::1/128"

  services:
    hermes:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:9119"
