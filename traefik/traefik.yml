# Traefik v3 static config — localsetup edge proxy for *.chadrbean.com
# TLS via Let's Encrypt DNS-01 (Route53). Runs with network_mode: host,
# so websecure binds 127.0.0.1:18443 directly (sslh forwards 443 -> 18443).

entryPoints:
  web:
    address: "127.0.0.1:3080"
  websecure:
    address: "127.0.0.1:18443"
  # Loopback-only, no TLS, no public routing — Prometheus (network_mode:
  # host, same box) scrapes this directly at 127.0.0.1:8082/metrics.
  metrics:
    address: "127.0.0.1:8082"
  # Loopback-only insecure API entrypoint (must be named "traefik" or
  # api.insecure=true auto-binds its own entrypoint to 0.0.0.0:8080,
  # publicly leaking the full routing table). Used by the Homepage
  # `traefik` widget (network_mode: host, same box) to read router/service
  # counts with zero credentials — never routed through the public
  # websecure entrypoint or exposed outside this box.
  traefik:
    address: "127.0.0.1:8083"

api:
  dashboard: true
  insecure: true

metrics:
  prometheus:
    entryPoint: metrics

# JSON access log, one line per request (client IP, host, status, backend,
# duration). Written inside the container to /var/log/traefik/access.log,
# bind-mounted to ./logs on the host (docker-compose.yaml) so native
# Promtail (monitoring/promtail/) can tail it into Loki.
accessLog:
  filePath: /var/log/traefik/access.log
  format: json
  bufferingSize: 100

experimental:
  plugins:
    fail2ban:
      moduleName: github.com/tomMoulard/fail2ban
      version: v0.9.0

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: false

certificatesResolvers:
  route53:
    acme:
      storage: /data/acme.json
      dnsChallenge:
        provider: route53
        propagation:
          delayBeforeChecks: 15
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"

log:
  level: INFO
