# Lets rootless podman (Traefik, uid 1000) bind :443 directly, so Traefik sees
# real client IPs with no sslh in front. Deployed to /etc/sysctl.d/99-unpriv-443.conf.
# Side effect: any local user may bind ports >= 443.
# Apply: sudo install -m 644 sysctl/99-unpriv-443.conf /etc/sysctl.d/ && sudo sysctl --system
net.ipv4.ip_unprivileged_port_start = 443
