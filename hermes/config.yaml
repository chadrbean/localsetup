      reference_models:
        - provider: openrouter
          model: deepseek/deepseek-v4-pro
          enabled: true
      degraded_reference_policy: loud
      fanout: user_turn
  reference_models:
    - provider: openrouter
      model: deepseek/deepseek-v4-pro
