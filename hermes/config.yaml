model:
  default: flash
  provider: gateway
  aliases:
    flash: gateway/flash
    pro: gateway/pro
    auto: gateway/smart
    kimi: gateway/kimi
    kimi-code: gateway-or/kimi-code
    gpt5: gateway-or/gpt5
    lite: gateway-or/glm-flash
    lite-deep: gateway-or/or-lite-qwen
    plan: gateway-or/or-plan-qwen
    plan-cheap: gateway-or/or-plan-minimax
    free: gateway-or/free
providers:
  gateway:
    base_url: http://localhost:4000/v1
    models:
      flash: flash
      pro: pro
      auto: smart
      kimi: kimi
    key_env: LITELLM_GENERAL_KEY
  gateway-or:
    base_url: http://localhost:4000/v1
    key_env: LITELLM_OPENROUTER_KEY
    models:
      glm-flash: or-lite-glm
      or-lite-qwen: or-lite-qwen
      or-plan-qwen: or-plan-qwen
      or-plan-minimax: or-plan-minimax
      kimi-code: kimi-code
      gpt5: gpt5
      kimi: kimi
      free: zai-free
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
agent:
  max_turns: 150
  verbose: false
  reasoning_effort: medium
  personalities: {}
terminal:
  backend: local
  cwd: /home/chad/git/wave
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
web:
  backend: brave-free
  use_gateway: false
browser:
  inactivity_timeout: 120
  cloud_provider: local
  use_gateway: false
context_file_max_chars: 40000
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  progress_notices: false
  threshold: 0.5
  target_ratio: 0.15
  protect_last_n: 20
  min_tail_user_messages: 1
  max_attempts: 3
  proactive_prune_tokens: 48000
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 8192
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  codex_responses_native: false
  codex_responses_compact_threshold: 200000
  idle_compact_after_seconds: 900
prompt_caching:
  cache_ttl: 5m
auxiliary:
  free_only: true
  title_generation:
    provider: gateway
    model: flash
display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: false
  background_process_notifications: concise
  streaming: true
  skin: default
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
dashboard:
  basic_auth:
    username: admin
    password_hash: scrypt$16384$8$1$fe+nx8f9NeDI6dR6qAntMw==$IzzJgnFyBb93IhIS2Z5XPupAB923zXA2OTAO/0vYiSo=
    secret: 22Lphut9yMwSTIPeKBKl0zdprq9DhqKUvAIYrUQPtK4
stt:
  enabled: true
  language: en
  local:
