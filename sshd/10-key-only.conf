# sshd drop-in: public-key authentication only.
#
# Deployed to /etc/ssh/sshd_config.d/10-key-only.conf (sshd_config `Include`s
# that directory first, and the first value wins). See docs/HOSTS.md.
#
# Why: sshd is reachable from the internet, and a botnet was guessing passwords
# at it (3,166 failures / 454 bans in fail2ban's sshd jail). Passwords off means
# guessing cannot succeed, whether or not fail2ban sees the real client IP
# (through sslh it never does: everything arrives as 127.0.0.1).
#
# Before adding a device, put its public key in ~/.ssh/authorized_keys.
PasswordAuthentication no
KbdInteractiveAuthentication no
