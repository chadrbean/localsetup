# Global jail policy — progressive bans. Applies to every jail (sshd, grafana,
# recidive) unless a jail overrides it. Named 00- so it loads first; per-jail
# files only set maxretry/findtime/base bantime.
#
# bantime.increment: each repeat ban of the same IP doubles the jail's base
#   bantime (formula: bantime * 2^(ban count)), capped at bantime.maxtime.
#   sshd 3h -> 6h -> 12h -> 24h ... -> 4w.
# bantime.overalljails: count prior bans from ANY jail, so an IP banned by
#   grafana starts sshd bans at the escalated length.
# bantime.rndtime: adds up to 10m of random jitter so botnets can't time the
#   exact unban moment.
# Requires ban history to survive: dbpurgeage = 30d in fail2ban.local.
#
# ignoreip: loopback + home LAN, never banned. ignoreself (default true)
# also covers this host's own addresses.
[DEFAULT]
bantime.increment = true
bantime.factor = 1
bantime.maxtime = 4w
bantime.rndtime = 10m
bantime.overalljails = true
ignoreself = true
ignoreip = 127.0.0.1/8 ::1 192.168.1.0/24
