# recidive jail — bans repeat offenders on ALL ports.
# Reads fail2ban's own log: an IP banned 3 times (by any jail) within 1 day
# gets a 1-week all-ports ban (nftables allports action from
# defaults-debian.conf). bantime.increment (00-defaults.conf) escalates repeat
# recidive bans further, capped at 4w.
# Uses the packaged `recidive` filter (ignores its own [recidive] lines).
[recidive]
enabled = true
backend = auto
logpath = /var/log/fail2ban.log
banaction = %(banaction_allports)s
maxretry = 3
findtime = 1d
bantime = 1w
