# sshd jail — journald backend (this host has no /var/log/auth.log, only
# journald; ssh.service is the Debian/OpenBSD sshd unit name here).
# chain = INPUT: bans traffic to the host's real sshd.
[sshd]
enabled = true
backend = systemd
journalmatch = _SYSTEMD_UNIT=ssh.service
chain = INPUT
port = ssh
maxretry = 4
findtime = 10m
bantime = 3h
