# grafana jail — journald backend. Bans IPs that fail Grafana login
# (monitoring_grafana container, grafana.chadrbean.com via traefik).
#
# The Grafana container logs to the host journald (rootless podman + journald
# driver). Failures appear as:
#   logger=context t=... level=error msg="Error while trying to authenticate user" error="invalid credentials"
# Matching level=error + that msg. maxretry 5 over 10m -> 1h ban, mirroring
# the traefik fail2ban-plugin numbers so the two layers stay consistent.
[grafana]
enabled = true
backend = systemd
journalmatch = CONTAINER_NAME=monitoring_grafana
filter = grafana
maxretry = 5
findtime = 10m
bantime = 1h
