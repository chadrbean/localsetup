# grafana jail — journald backend. Bans IPs that fail Grafana login
# (monitoring_grafana container, grafana.chadrbean.com via traefik).
#
# The Grafana container logs to the host journald (rootless podman + journald
# driver). The filter (filter.d/grafana.conf) matches each failed login's
#   msg="Request Completed" method=POST path=/api/login status=401 remote_addr=<IP>
# maxretry 5 over 10m -> 1h base ban (escalated by bantime.increment in
# 00-defaults.conf), mirroring the traefik fail2ban-plugin numbers.
#
# CAVEAT: Traefik sees every client as 127.0.0.1 (sslh is not transparent), so
# Grafana's remote_addr comes from X-Forwarded-For, which a client can spoof.
# Treat this jail as defense-in-depth; the traefik fail2ban plugin is the
# primary HTTP guard.
[grafana]
enabled = true
backend = systemd
journalmatch = CONTAINER_NAME=monitoring_grafana
filter = grafana
maxretry = 5
findtime = 10m
bantime = 1h
