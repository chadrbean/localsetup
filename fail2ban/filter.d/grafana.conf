# Fail2ban filter: Grafana failed logins (journald backend)
# Grafana 11.2 logs each failed login attempt as:
#   logger=context userId=0 orgId=0 uname= t=... level=info msg="Request Completed" method=POST path=/api/login status=401 remote_addr=<IP> ...
# (preceded by an error="[auth.unauthorized]" line). The 401-on-/api/login
# "Request Completed" line is the reliable fingerprint, and remote_addr is the
# source IP. <HOST> is required (fail2ban failure-id group).
[Definition]
failregex = ^.*msg="Request Completed".*method=POST path=/api/login status=401.*remote_addr=<HOST>
ignoreregex =
