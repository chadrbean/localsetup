# Prometheus alert rules — monitoring stack
# Evaluated every evaluation_interval (15s). Surface in Prometheus UI at
# http://127.0.0.1:9090/alerts. Grafana alert rules (LogQL-based) live in
# provisioning/alerts/ — this file covers collector-health rules for what
# Prometheus scrapes directly (promtail, loki) vs Grafana alerting for
# log-derived conditions (ban spikes, backup staleness).
groups:
  - name: collectors
    interval: 30s
    rules:
      - alert: PromtailDown
        expr: up{job="promtail"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Promtail (log shipper) is down on {{ $labels.instance }}"
          description: "Promtail has been unreachable for >1m. fail2ban and Kopia logs are NOT being shipped to Loki."

      - alert: LokiDown
        expr: up{job="loki"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Loki (log store) is down on {{ $labels.instance }}"
          description: "Loki on {{ $labels.instance }} has been unreachable for >1m. Log queries and LogQL alerting are unavailable."

      - alert: PromtailHighIngestionErrors
        expr: rate(promtail_files_writes_failed_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Promtail is failing to send logs to Loki"
          description: "Promtail on {{ $labels.instance }} has had write errors in the last 5m."