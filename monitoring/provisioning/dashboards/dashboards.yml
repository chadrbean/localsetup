# Grafana provisioning — dashboard providers. Both rescan every 30s.
#   default: ./data/dashboards  (git-ignored; fetched JSON, e.g. LiteLLM via
#            scripts/fetch_litellm_dashboard.sh) -> General folder
#   tracked: ./dashboards       (committed; fail2ban, traefik-security, kopia)
#            -> "Ops" folder. Edit the JSON in the repo, not in the UI
#            (allowUiUpdates: false — UI saves would be lost on rescan).
# A dashboard uid must exist in only ONE provider, or Grafana flip-flops.
apiVersion: 1

providers:
  - name: default
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards

  - name: tracked
    orgId: 1
    folder: Ops
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards-tracked
