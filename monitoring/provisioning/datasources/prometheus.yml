# Grafana provisioning — datasource (auto-created at container start)
apiVersion: 1

# Fixed uid `prometheus` so tracked dashboards + alert rules can reference it.
# deleteDatasources clears the older auto-uid copy before re-creating.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    uid: prometheus
    isDefault: true
    editable: false
