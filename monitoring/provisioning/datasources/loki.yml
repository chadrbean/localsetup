# Grafana provisioning — Loki datasource (auto-created at grafana start)
# Prometheus datasource is declared in the separate prometheus.yml.
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://127.0.0.1:3100
    uid: loki
    isDefault: false
    editable: false