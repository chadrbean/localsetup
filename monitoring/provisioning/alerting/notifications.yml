# Grafana alert notification routing (provisioned).
# Every alert in every folder goes to one email contact point, delivered via
# the SES SMTP relay configured by GF_SMTP_* in ../../docker-compose.yml.
# ${GRAFANA_ALERT_EMAIL} is interpolated from the container env (monitoring/.env).
# Replaces the placeholder "grafana-default-email <example@email.com>" receiver
# that silently failed every notification ("SMTP not configured").
apiVersion: 1

contactPoints:
  - orgId: 1
    name: email-chad
    receivers:
      - uid: email-chad
        type: email
        settings:
          addresses: ${GRAFANA_ALERT_EMAIL}
          singleEmail: true
        disableResolveMessage: false  # also email when an alert resolves

policies:
  - orgId: 1
    receiver: email-chad
    group_by: [grafana_folder, alertname]
    group_wait: 30s        # batch alerts firing together
    group_interval: 5m     # min gap before a changed group re-notifies
    repeat_interval: 4h    # reminder while still firing
