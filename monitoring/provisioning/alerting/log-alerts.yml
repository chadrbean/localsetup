# Grafana provisioned alert rules — log conditions (LogQL via Loki).
# Run in Grafana's unified alerting engine (no Loki ruler), routed to email by
# contact-points.yml. Datasource uid "loki" is from datasources/loki.yml.
#
# Rule shape (Grafana 11): A = Loki instant query -> B = reduce(last) ->
# C = threshold. The old rules used `classic_conditions` with math strings and
# `unwrap _`, which Loki rejected (HTTP 400) — Kopia Backup Stale was stuck
# firing on the error, the fail2ban rules never evaluated.
# Collector/service health rules live in health-alerts.yml.
apiVersion: 1

groups:
  # ── fail2ban: attack volume ──────────────────────────────────────────
  - orgId: 1
    name: fail2ban-logs
    folder: Logs
    interval: 1m
    rules:
      - uid: fail2ban_ban_spike
        title: Fail2ban Ban Spike
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: 'sum(count_over_time({job="fail2ban", action="Ban"}[5m]))'
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [10] }
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "fail2ban ban spike: {{ humanize $values.B.Value }} bans in 5m"
          description: "More than 10 IPs banned in the last 5 minutes (normal is ~1-2/h). Likely a coordinated brute-force wave. Dashboard: https://grafana.chadrbean.com/d/fail2ban"
        labels:
          severity: warning

      - uid: fail2ban_high_ban_rate
        title: Fail2ban High Ban Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: 'sum(count_over_time({job="fail2ban", action="Ban"}[1h]))'
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [40] }
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: "fail2ban sustained high ban rate: {{ humanize $values.B.Value }} bans in 1h"
          description: "More than 40 bans/hour sustained for 15m (baseline ~35/day). Dashboard: https://grafana.chadrbean.com/d/fail2ban"
        labels:
          severity: critical

  # ── Kopia: backup freshness + errors ─────────────────────────────────
  # Signals are Promtail `event` labels on Kopia's DEBUG log (see
  # monitoring/promtail/promtail-config.yaml and docs/KOPIA-MONITORING.md):
  #   snapshot_summary = root dir `snapshotted directory {"path":".",...}` without error
  #   storage          = S3 blob ops ("error":"..." when one failed)
  #   error/file_error = WARN+ lines / snapshotted entries carrying an error
  # Kopia snapshots hourly (kopia/policies, intervalSeconds 3600) while KopiaUI
  # runs. Snapshot FAILURES are also emailed by Kopia's own notification
  # profile (kopia/README.md), which has the error message.
  - orgId: 1
    name: kopia
    folder: Logs
    interval: 5m
    rules:
      - uid: kopia_backup_warning
        title: Kopia Backup Warning
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 10800, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: 'sum(count_over_time({job="kopia", component="uploader"} |~ `snapshotted directory\s+\{"path":"\."` [3h]))'
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: Alerting
        execErrState: Error
        for: 30m
        annotations:
          summary: "Kopia: no snapshot in the last 3 hours"
          description: "Hourly snapshots have stopped. Is KopiaUI running (it only snapshots while the desktop app is open)? Dashboard: https://grafana.chadrbean.com/d/kopia"
        labels:
          severity: warning

      - uid: kopia_backup_stale
        title: Kopia Backup Stale
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 86400, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: 'sum(count_over_time({job="kopia", event="snapshot_summary"} [24h]))'
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: Alerting
        execErrState: Error
        for: 10m
        annotations:
          summary: "Kopia backup is stale: no successful snapshot in 24 hours"
          description: "No Kopia snapshot has completed without error in 24h. Check KopiaUI is running, the S3 repository is connected, and Promtail is shipping logs. Dashboard: https://grafana.chadrbean.com/d/kopia · Runbook: docs/KOPIA-MONITORING.md"
        labels:
          severity: critical

      - uid: kopia_snapshot_errors
        title: Kopia Snapshot Errors
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 7200, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: 'sum(sum_over_time({job="kopia", component="uploader"} |~ `snapshotted directory\s+\{"path":"\."` | regexp `"errors":(?P<errors>\d+)` | unwrap errors [2h]))'
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Kopia snapshots reported {{ humanize $values.B.Value }} file errors in the last 2h"
          description: "A snapshot finished with errors > 0 (unreadable files/dirs). Check the Kopia log stream on https://grafana.chadrbean.com/d/kopia"
        labels:
          severity: warning

      - uid: kopia_storage_errors
        title: Kopia S3 Storage Errors
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: 'sum(count_over_time({job="kopia", event="storage"} |= `"error":"` [15m]))'
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Kopia S3 operations failing: {{ humanize $values.B.Value }} errors in 15m"
          description: "Blob operations against s3://chadrbean-backups returned errors (credentials, network or bucket). Dashboard: https://grafana.chadrbean.com/d/kopia"
        labels:
          severity: critical

      - uid: kopia_log_errors
        title: Kopia Log Errors
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: 'sum(count_over_time({job="kopia", event=~"error|file_error"} [15m]))'
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Kopia logged {{ humanize $values.B.Value }} WARN/ERROR or errored-file lines in 15m"
          description: "See 'Warnings & errors' on https://grafana.chadrbean.com/d/kopia"
        labels:
          severity: warning
