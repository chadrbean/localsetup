# Prometheus config — monitoring stack (localsetup)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  # LiteLLM gateway. /metrics on the proxy port requires auth: the master key
  # is mounted (ro, chmod 600) from monitoring/prometheus/bearer_token, which
  # is git-ignored and generated from ../.env by scripts/refresh_bearer_token.sh.
  # LiteLLM 307-redirects /metrics -> /metrics/ (trailing slash is canonical —
  # verified 2026-09-08); scrape the canonical path directly and keep
  # follow_redirects on as belt-and-suspenders.
  - job_name: litellm
    metrics_path: /metrics/
    scheme: http
    follow_redirects: true
    bearer_token_file: /etc/prometheus/litellm_bearer_token
    static_configs:
      - targets: ["127.0.0.1:4000"]

  # Future slices (see monitoring/README.md): node_exporter (workstations),
  # hermes dashboard /api/metrics (basic-auth). Add jobs here + targets.
