# Drop-in for the Grafana apt package's alloy.service, installed by install.sh
# to /etc/systemd/system/alloy.service.d/override.conf with @USER@ / @HOME@
# filled in. Runs Alloy as the desktop user (its home is 0710, so the package's
# `alloy` user can't read ~/.cache/kopia) with config and state in that home,
# so updates need no sudo (monitoring/alloy/deploy.sh push).
[Service]
User=@USER@
Group=@USER@
# The package's WorkingDirectory=/var/lib/alloy is 0700 alloy:alloy, so the
# desktop user can't chdir there (status=200/CHDIR). Use the state dir instead.
WorkingDirectory=@HOME@/.local/share/alloy
EnvironmentFile=
ExecStart=
ExecStart=/usr/bin/alloy run --server.http.listen-addr=127.0.0.1:12345 --storage.path=@HOME@/.local/share/alloy --disable-reporting @HOME@/.config/alloy/config.alloy
