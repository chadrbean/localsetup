# Observability stack: Prometheus + Grafana (podman compose, pod pod_monitoring)
# Prometheus scrapes the LiteLLM gateway 127.0.0.1:4000/metrics (master-key
# bearer token from monitoring/prometheus/bearer_token) and itself (9090).
# Grafana is the UI, published at grafana.chadrbean.com:8443 via traefik;
# auth is Grafana's OWN (admin user/pass from GRAFANA_ADMIN_* in ../.env) —
# the traefik route carries only the fail2ban middleware, deliberately NOT
# dashboard-auth (single-user middleware; Grafana has its own login).
# Both containers use network_mode: host (like traefik) so they reach host
# services directly; NO ports: section (3000/9090 bind loopback via the
# containers' own listeners; traefik is the only public ingress).
# Manage via: ../compose.sh monitoring up -d  (registers the project)
# Volumes + monitoring/data (dashboards) persist across rebuilds.
services:
  prometheus:
    image: docker.io/prom/prometheus:v2.53.1
    container_name: monitoring_prometheus
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/bearer_token:/etc/prometheus/litellm_bearer_token:ro
      - prometheus_data:/prometheus

  grafana:
    image: docker.io/grafana/grafana-oss:11.2.0
    container_name: monitoring_grafana
    restart: unless-stopped
    network_mode: host
    environment:
      GF_SERVER_ROOT_URL: https://grafana.chadrbean.com:8443/
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in ../.env}"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./data/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  prometheus_data:
    name: monitoring_prometheus_data
  grafana_data:
    name: monitoring_grafana_data
