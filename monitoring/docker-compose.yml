# Observability stack: Loki + Prometheus + Grafana (podman compose, pod pod_monitoring)
# Prometheus scrapes LiteLLM (bearer token from monitoring/prometheus/bearer_token),
# Traefik, Loki, native Promtail and the native fail2ban exporter.
# Grafana is the UI, published at grafana.chadrbean.com (port 443, via sslh+traefik);
# auth is Grafana's OWN (admin user/pass from GRAFANA_ADMIN_* in monitoring/.env) —
# the traefik route carries only the fail2ban middleware, deliberately NOT
# dashboard-auth (single-user middleware; Grafana has its own login).
# Grafana also owns ALL alerting (provisioning/alerting/) and emails via SES SMTP.
# All containers use network_mode: host (like traefik) so they reach host
# services directly; NO ports: section (3000/9090 bind loopback via the
# containers' own listeners; traefik is the only public ingress).
# Manage via: podman-compose up -d  (from this directory)
# Volumes + monitoring/data (fetched dashboards) persist across rebuilds.
services:
  # Loki — log store (single-binary, filesystem, loopback :3100).
  # Ingests fail2ban + Traefik + Kopia logs shipped by the NATIVE Promtail
  # service (monitoring/promtail/, systemd user unit — must be native because
  # rootless podman can't read /var/log/fail2ban.log owned by root:adm).
  # 7d retention (loki_data volume). network_mode: host so Promtail on the
  # host reaches it at 127.0.0.1:3100.
  loki:
    image: docker.io/grafana/loki:3.1.1
    container_name: monitoring_loki
    restart: unless-stopped
    network_mode: host
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki

  prometheus:
    image: docker.io/prom/prometheus:v2.53.1
    container_name: monitoring_prometheus
    restart: unless-stopped
    network_mode: host
    # Run as container-root, which rootless podman maps to host chad. The image
    # default (nobody) can't read the 0600 chad-owned bearer_token, which left
    # the litellm target DOWN. Keeps the token private; no chmod loosening.
    user: "0:0"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/bearer_token:/etc/prometheus/litellm_bearer_token:ro
      - prometheus_data:/prometheus

  grafana:
    image: docker.io/grafana/grafana-oss:11.2.0
    container_name: monitoring_grafana
    restart: unless-stopped
    network_mode: host
    environment:
      GF_SERVER_ROOT_URL: https://grafana.chadrbean.com/
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in monitoring/.env}"
      # Alert email via Amazon SES SMTP, us-west-2 (see monitoring/README.md).
      # Credentials = the Terraform-managed hermes-ses-email IAM user
      # (~/git/aws-infrastructure outputs). Its policy only allows
      # ses:FromAddress = hermes@chadrbean.com, so the sender must stay that.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "${GRAFANA_SMTP_HOST:-email-smtp.us-west-2.amazonaws.com:587}"
      GF_SMTP_USER: "${GRAFANA_SMTP_USER:-}"
      GF_SMTP_PASSWORD: "${GRAFANA_SMTP_PASSWORD:-}"
      GF_SMTP_FROM_ADDRESS: "${GRAFANA_SMTP_FROM:-hermes@chadrbean.com}"
      GF_SMTP_FROM_NAME: Grafana (localsetup)
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
      # Expanded inside provisioning/alerting/contact-points.yml.
      ALERT_EMAIL_TO: "${ALERT_EMAIL_TO:?set ALERT_EMAIL_TO in monitoring/.env}"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      # Fetched/runtime dashboards (git-ignored), e.g. LiteLLM.
      - ./data/dashboards:/var/lib/grafana/dashboards:ro
      # Hand-built, tracked dashboards (fail2ban, traefik-security, kopia).
      - ./dashboards:/var/lib/grafana/dashboards-tracked:ro

volumes:
  prometheus_data:
    name: monitoring_prometheus_data
  grafana_data:
    name: monitoring_grafana_data
  loki_data:
    name: monitoring_loki_data
