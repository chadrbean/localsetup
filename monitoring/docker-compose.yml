# Observability stack: Prometheus + Grafana + Loki + blackbox_exporter (podman compose, pod pod_monitoring)
# Prometheus scrapes the LiteLLM gateway 127.0.0.1:4000/metrics (master-key
# bearer token from monitoring/prometheus/bearer_token) and itself (9090).
# Grafana is the UI, published at grafana.chadrbean.com (port 443, via sslh+traefik);
# auth is Grafana's OWN (admin user/pass from GRAFANA_ADMIN_* in monitoring/.env) —
# the traefik route carries only the fail2ban middleware, deliberately NOT
# dashboard-auth (single-user middleware; Grafana has its own login).
# Both containers use network_mode: host (like traefik) so they reach host
# services directly; NO ports: section (3000/9090 bind loopback via the
# containers' own listeners; traefik is the only public ingress).
# Manage via: podman-compose up -d  (from this directory)
# Volumes + monitoring/data (dashboards) persist across rebuilds.
services:
  # Loki — log store (single-binary, filesystem, loopback :3100).
  # Ingests fail2ban + Kopia logs shipped by the NATIVE Promtail service
  # (monitoring/promtail/, systemd user unit — must be native because
  # rootless podman can't read /var/log/fail2ban.log owned by root:adm).
  # 7d retention (loki_data volume). network_mode: host so Promtail on the
  # host reaches it at 127.0.0.1:3100.
  loki:
    image: docker.io/grafana/loki:3.1.1
    container_name: monitoring_loki
    restart: unless-stopped
    network_mode: host
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki

  prometheus:
    image: docker.io/prom/prometheus:v2.53.1
    container_name: monitoring_prometheus
    restart: unless-stopped
    network_mode: host
    # Root inside rootless podman == host uid 1000 (no privilege gain). Needed
    # to read the chmod-600 bearer_token; the image default `nobody` can't.
    user: "0"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/bearer_token:/etc/prometheus/litellm_bearer_token:ro
      - prometheus_data:/prometheus

  # blackbox_exporter — HTTP uptime probes (LiteLLM /health/readiness +
  # /health/liveliness), scraped by the `litellm-health` Prometheus job.
  # Loopback-only listener; config in ./blackbox.yml.
  blackbox:
    image: docker.io/prom/blackbox-exporter:v0.25.0
    container_name: monitoring_blackbox
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/blackbox/blackbox.yml
      - --web.listen-address=127.0.0.1:9115
    volumes:
      - ./blackbox.yml:/etc/blackbox/blackbox.yml:ro

  grafana:
    image: docker.io/grafana/grafana-oss:11.2.0
    container_name: monitoring_grafana
    restart: unless-stopped
    network_mode: host
    environment:
      GF_SERVER_ROOT_URL: https://grafana.chadrbean.com/
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in monitoring/.env}"
      # Alert email via Amazon SES SMTP relay (us-west-2). Credentials belong to
      # the send-only IAM user `grafana-ses-smtp`; values live in monitoring/.env.
      GF_SMTP_ENABLED: "${GRAFANA_SMTP_ENABLED:-false}"
      GF_SMTP_HOST: email-smtp.us-west-2.amazonaws.com:587
      GF_SMTP_USER: "${GRAFANA_SMTP_USER:-}"
      GF_SMTP_PASSWORD: "${GRAFANA_SMTP_PASSWORD:-}"
      GF_SMTP_FROM_ADDRESS: grafana@chadrbean.com
      GF_SMTP_FROM_NAME: Grafana localsetup
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
      # Interpolated into provisioning/alerting/notifications.yml (keeps the
      # address out of git).
      GRAFANA_ALERT_EMAIL: "${GRAFANA_ALERT_EMAIL:?set GRAFANA_ALERT_EMAIL in monitoring/.env}"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./data/dashboards:/var/lib/grafana/dashboards:ro
      - ./dashboards:/var/lib/grafana/dashboards-tracked:ro  # git-tracked (LiteLLM Gateway)

volumes:
  prometheus_data:
    name: monitoring_prometheus_data
  grafana_data:
    name: monitoring_grafana_data
  loki_data:
    name: monitoring_loki_data
